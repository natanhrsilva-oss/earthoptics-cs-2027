<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Caderno de Campo · EarthOptics CS 2027</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#274820;--g2:#426b4f;--br:#9fc55a;--brown:#622a10;--clay:#b06c52;--or:#f2944c;--sand:#edb381;--warm:#ebe3df;--ink:#1a1a1a;--mut:#666}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#f7f4f2;font-size:14px}
a{color:#0b87ba;font-weight:600;text-decoration:none}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;background:var(--warm);color:var(--g)}
.chip.s6{background:var(--sand)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.or{background:var(--or)}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;color:var(--g);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d8d0cb;border-radius:8px;background:#fff}
textarea{min-height:60px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
.rec{border:1px solid #e8e1dc;border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
.rec .rh{font-size:12.5px}.rec .rh span{color:var(--mut);font-size:11px}
.rec img{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;display:block}
.rec audio{width:100%;margin-top:6px}
.rec .rt{font-size:13px;margin-top:4px;white-space:pre-wrap}
.stepper{display:flex;gap:3px;margin:8px 0 12px}
.stepper div{flex:1;height:6px;border-radius:3px;background:var(--warm)}
.stepper div.done{background:var(--g2)}.stepper div.cur{background:var(--or)}
.fchip{display:inline-block;background:var(--warm);border-radius:8px;padding:5px 10px;font-size:12px;margin-top:6px}
.csbox{background:#eef4ec;border-left:4px solid var(--g2);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.csbox .cst{font-weight:700;color:var(--g2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.csbox span{color:var(--mut)}
.csbox .ck{margin:3px 0;color:#888}.csbox .ck.on{color:var(--g);font-weight:600}
.csbox .msg{margin-top:6px;background:#fff;border-radius:6px;padding:6px 8px}
details.box{border:1px solid #e3ddd8;border-radius:10px;padding:8px 12px;margin:12px 0;background:#fff}
details.box>summary{font-weight:700;color:var(--g);cursor:pointer;font-size:14px}
.multi{display:flex;gap:6px;flex-wrap:wrap}
.multi label{display:flex;align-items:center;gap:6px;margin:0;border:1px solid #d8d0cb;border-radius:20px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--g)}
.multi input{width:auto;margin:0}
.dl{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.dl.ok{background:#eef4ec;border-left:4px solid var(--g2)}
.dl.wait{background:#fdf3ea;border-left:4px solid var(--or)}
.dl.late{background:#fbeeea;border-left:4px solid var(--clay)}
.dl b{display:block;font-size:14px;color:var(--g)}

body{background:#fff;max-width:560px;margin:0 auto}
.top{background:var(--g);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px}.top .brand img{height:30px;display:block}.top .brand span{border-left:1px solid #ffffff55;padding-left:10px}
.top .who{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.top select{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:5px 8px;font-size:13px;width:auto}
.top select option{color:#000}
.wrap{padding:14px 16px 90px}
h1{font-size:19px;color:var(--g);margin:4px 0 10px}
h2{font-size:15px;color:var(--g);margin:18px 0 6px}
.cli{border:1px solid #e3ddd8;border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.cli b{color:var(--g);font-size:15px}
.cli small{display:block;color:var(--mut);font-size:12px;margin:2px 0 6px}
.stagehead{color:var(--or);font-weight:700;font-size:14px}
.crit{background:var(--warm);border-left:4px solid var(--or);padding:10px;margin:14px 0;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.crit input{width:22px;height:22px;flex:none}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3ddd8;padding:10px 16px;display:flex;gap:8px;max-width:560px;margin:0 auto}
.bar .btn{flex:1;padding:12px}
.addbox{background:#faf7f5;border:1px dashed #cfc4bd;border-radius:12px;padding:10px 12px;margin-top:8px}
details.prev{border:1px solid #eee;border-radius:10px;padding:8px 10px;margin:6px 0}
details.prev summary{font-weight:600;color:var(--g);font-size:13px;cursor:pointer}
.ans{font-size:12.5px;margin:6px 0}.ans span{color:var(--mut)}
.search{margin-bottom:10px}
.kml{font-size:12px;color:var(--g2)}
.dlk{color:#0b6fa0;font-weight:600;text-decoration:none;word-break:break-all}
.note{font-size:12.5px;color:var(--mut)}
#auth{position:fixed;inset:0;background:var(--g);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.authw{width:100%;max-width:380px;text-align:center;color:#ffffffaa}
.alogo{height:40px;margin:0 auto 18px;display:block}
.authc{background:#fff;border-radius:16px;padding:22px 22px 16px;text-align:left;color:#222;margin-bottom:12px}
.authc h2{color:var(--g);margin:0 0 10px;font-size:18px}
.authc .note{font-size:12.5px;color:var(--mut)}

.btn.red{background:#b3261e;border-color:#b3261e;color:#fff}
.tabs{display:flex;gap:6px;margin:2px 0 12px}.tabs button{flex:1;border:1px solid #d8d0cb;background:#fff;border-radius:20px;padding:9px;font:inherit;font-weight:700;color:var(--g);font-size:13.5px}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{background:var(--or);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
.nt{border:1px solid #e3ddd8;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.nt.new{border-left:4px solid var(--or);background:#fff8f2}.nt b{color:var(--g);font-size:14px}.nt p{margin:4px 0;font-size:13px}.nt small{color:var(--mut);font-size:11.5px}
#bell{color:#fff;font-size:12px;text-decoration:none;opacity:.85}#bell.has{opacity:1;font-weight:700;color:var(--br)}
.doc{font-size:11.5px;font-weight:600;color:#0b6fa0;margin-left:4px;white-space:nowrap}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.rbox{background:var(--warm);border-radius:10px;padding:8px 10px;text-align:center}.rbox b{display:block;font-size:22px;color:var(--g)}.rbox span{font-size:11px;color:var(--mut)}
.rbig{border:1px solid #e3ddd8;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}.rbig.f{border-top:4px solid var(--g2)}.rbig.a{border-top:4px solid var(--or)}.rbig .t{font-weight:700;color:var(--g);margin-bottom:4px}.rbig b{color:var(--g)}
.rf{display:grid;grid-template-columns:150px 1fr 22px;gap:6px;align-items:center;font-size:11.5px;margin:3px 0}.rf div{background:#eee8e4;border-radius:5px;height:10px}.rf i{display:block;height:100%;background:var(--g2);border-radius:5px}.rf b{text-align:right}
.cli.fin{cursor:default;background:#faf7f5}
.chip.won{background:#9fc55a;color:#274820}.chip.rc{background:#ebe3df;color:#622a10}
</style>
</head>

function startDate(c){return ((c.hist||[])[0]||{}).date||c.upd||""}
function alertsOf(db){const a=[];db.clients.filter(isActive).forEach(c=>{const n=days(c);const p=propDeadline(c);
 if(c.stage===2&&p&&!p.done&&p.left<0)a.push([c,`Proposta atrasada: prazo de 48 h vencido há ${Math.round(-p.left)} h`]);
 else if(c.stage===2&&p&&!p.done)a.push([c,`Proposta vence em ${Math.round(p.left)} h`]);
 else if(c.stage===2&&n>14)a.push([c,`Proposta sem resposta há ${n} dias`]);
 else if(c.stage===4&&n>15)a.push([c,`Coleta atrasada há ${n} dias`]);
 else if(c.stage===5&&analysisDue(c)&&!c.cs[4]?.["Laudo pronto"]&&analysisDue(c)<todayISO())a.push([c,`Análise passou do prazo (${fmtDate(analysisDue(c))})`]);
 else if(n>21)a.push([c,`Sem atualização há ${n} dias`])});return a}
/* Ofertas de novas áreas: [índice da etapa, campo da oferta, campo do KML, momento] */
const OFFERS=[[5,"Oferta de expansão","KML das novas áreas","entrega técnica"],[6,"D+7 · oferta de orçamento novas áreas","D+7 · KML das novas áreas","D+7"],[6,"Colheita · oferta de orçamento novas áreas","Colheita · KML das novas áreas","colheita"]];
const baseName=n=>n.replace(/\s+RECOMPRA(\s+\d+)?$/,"");
/* próximo nome de recompra: "Nome RECOMPRA", depois "Nome RECOMPRA 2", "Nome RECOMPRA 3"... */
function recompraName(db,c){const b=baseName(c.nome);let k=0;db.clients.forEach(x=>{if(baseName(x.nome)!==b)return;const m=x.nome.match(/RECOMPRA(?:\s+(\d+))?$/);if(m)k=Math.max(k,m[1]?+m[1]:1)});return b+" RECOMPRA"+(k?" "+(k+1):"")}
const lnk=u=>!u?"":/^[a-z][\w+.-]*:/i.test(u)?u:"https://"+u;
const isActive=c=>!c.status||c.status==="ativo";
function newId(db){return Date.now()*1000+Math.floor(Math.random()*1000)}
function spawnRecompra(db,c,o){const now=new Date().toISOString();const id=newId(db);
 const n={id,nome:recompraName(db,c),seller:c.seller,sellerId:c.sellerId,tipo:c.tipo||"",uf:c.uf,stage:1,upd:todayISO(),geo:c.geo,plat:c.plat,sf:c.sf,kml:null,kmlAt:null,agencia:c.agencia||"",ans:{0:{...(c.ans[0]||{})}},cs:{},hist:[],status:"ativo",parent:c.id,...o};
 n.hist.push({stage:n.stage,date:todayISO(),by:o.by||c.seller});db.clients.push(n);return n}
/* Depois de salvar uma etapa no caderno: cria RECOMPRA (aceite + KML) ou lead RECOMPRA (recusa final) */
function processOffers(db,c,by){const msgs=[];c.spawn=c.spawn||{};c.kmlExp=c.kmlExp||{};
 OFFERS.forEach(([i,off,kl,when])=>{const v=c.ans[i]?.[off];if(c.spawn[off])return;
  if(v==="Aceitou"&&c.kmlExp[kl]){const k=c.kmlExp[kl];const n=spawnRecompra(db,c,{stage:2,kml:{name:k.name,type:k.type,size:k.size,path:k.path,at:k.at},kmlAt:k.at,geo:k.geo||c.geo,origem:"Expansão aceita no "+when,by});
   c.spawn[off]=n.id;c.won=true;finalize(c,"Recompra · expansão aceita no "+when,"");msgs.push(`Cliente ganho: "${n.nome}" criado na etapa 2. "${c.nome}" foi para Finalizados`)}
  if(v==="Recuou"&&when==="colheita"){c.spawn[off]=-1;finalize(c,"Não renovou · recusou na colheita",c.ans[i]["Motivo (se recusou na colheita)"]||"");msgs.push(`"${c.nome}" foi para Finalizados (não renovou)`)}});
 if(c.ans[7]?.["Resultado"]==="Perdeu"&&!c.spawn["Resultado"]){c.spawn["Resultado"]=-1;finalize(c,"Não renovou · fim do ciclo",c.ans[7]["Motivo da perda"]||"");msgs.push(`"${c.nome}" foi para Finalizados (não renovou)`)}
 return msgs}
/* finalizado: sai da jornada, vai para Finalizados no caderno e para Leads no painel */
function finalize(c,origem,motivo){Object.assign(c,{status:"finalizado",leadOrigem:origem,leadMotivo:motivo,leadDate:todayISO()})}
/* Quem precisa responder: CS (vermelho) ou vendedor (laranja) */
const CHECKS5=["Contato 1 · Introdução à metagenômica","Contato 2 · Books","Contato 3 · Como ler os resultados","Laudo pronto"];
function needsCS(c){if(!isActive(c))return "";const cs=c.cs||{};
 if(c.stage<=2&&c.kml&&!cs[1]?.["Link da proposta"])return "Enviar proposta (48 h)";
 if(c.stage===4&&(!cs[3]?.["Data prevista da coleta"]||!cs[3]?.["Empresa amostradora"]))return "Definir coleta e amostrador";
 if(c.stage===4&&!cs[3]?.["Coleta concluída"])return "Confirmar a coleta";
 if(c.stage===5&&!(cs[4]?.["Data de chegada em Campinas"]||cs[3]?.["Data de chegada em Campinas"]))return "Registrar chegada no laboratório";
 if(c.stage===5&&(cs[4]?.["Amostras recebidas"]||cs[3]?.["Amostras recebidas"])!=="100% recebidas")return "Confirmar recebimento das amostras";
 if(c.stage===5&&!CHECKS5.every(k=>cs[4]?.[k]))return "Fazer contatos e liberar laudo";
 if(c.stage===5&&!cs[4]?.["Entrega técnica marcada para"])return "Marcar a entrega técnica";
 if(c.vAt&&(!c.csAt||c.vAt>c.csAt))return "Nova atualização do vendedor";return ""}
function needsSeller(c){if(!isActive(c)||needsCS(c))return "";const a=c.ans||{};
 if(c.stage===1&&!c.kml)return "Aguardando KML do vendedor";
 if(c.stage===2&&(!a[1]?.["Aprovação formalizada"]||a[1]["Aprovação formalizada"]==="—"))return "Aguardando aprovação do cliente";
 if(c.stage===3&&!a[2]?.["Valor final (R$)"])return "Aguardando dados fiscais";
 if(c.stage===6&&(!a[5]?.["Oferta de expansão"]||a[5]["Oferta de expansão"]==="—"))return "Aguardando entrega e oferta";return ""}
/* KML: centro da área a partir das coordenadas */
function kmlCenter(txt){if(!txt)return null;const m=[...txt.matchAll(/<coordinates>([\s\S]*?)<\/coordinates>/g)];let la=0,lo=0,n=0;
 m.forEach(x=>x[1].trim().split(/\s+/).forEach(t=>{const p=t.split(",");const a=+p[1],o=+p[0];if(!isNaN(a)&&!isNaN(o)){la+=a;lo+=o;n++}}));return n?{lat:la/n,lon:lo/n}:null}
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rankSamplers(db,c){if(!c.geo)return db.samplers.map(s=>({s,d:null}));return db.samplers.map(s=>({s,d:distKm(c.geo,s)})).sort((x,y)=>x.d-y.d)}
function agName(db,id){const a=(db.consultorias||[]).find(x=>x.id===id);return a?a.nome:""}
function samplerName(db,id){const s=db.samplers.find(x=>x.id===id);return s?`${s.nome} · ${s.cidade}/${s.uf}`:""}

 if(f.type.startsWith("audio/"))return `<audio controls src="${u}"></audio>`;
 if(f.type.startsWith("video/"))return `<video controls src="${u}" style="max-width:100%;border-radius:8px;margin-top:6px"></video>`;
 return `<a class="fchip" href="${u}" target="_blank">📄 ${esc(f.name)}</a>`}

 return rs.map(r=>`<div class="rec"><div class="rh"><b>${esc(r.title||"Registro")}</b> <span>${esc(r.by)} · ${fmtDate(r.date)}</span></div>
  ${r.text?`<div class="rt">${esc(r.text)}</div>`:""}${(r.files||[]).map(fileHTML).join("")}</div>`).join("");
}
function csInfoHTML(db,c,i){const f=CSF[i];const v=c.cs[i]||{};const msg=c.cs[i]?.["Mensagem para o vendedor"];
 const rows=f.map(([lab,t])=>{let val=v[lab];if(t==="check")return `<div class="ck ${val?"on":""}">${val?"✔":"○"} ${esc(lab)} ${val?docLinks(lab):""}</div>`;
  if(!val)return "";if(t==="url")return `<div><span>${esc(lab)}:</span> <a href="${esc(lnk(val))}" target="_blank" rel="noopener">abrir</a></div>`;
  if(t==="sampler")val=samplerName(db,val);if(t==="date")val=fmtDate(val);if(lab.includes("R$"))val=brl(val);
  return `<div><span>${esc(lab)}:</span> ${esc(val)}</div>`}).join("");

 return rows||msg?`<div class="csbox"><div class="cst">Informações do CS</div>${rows}${due}${msg?`<div class="msg">💬 ${esc(msg)}</div>`:""}</div>`:"";
}

/* Notificação para o vendedor quando o CS salva uma etapa */
function csNotice(c,i,before,after){const ch=k=>(after[k]||"")!==(before[k]||"")&&after[k];const L=[];let title="";
 if(i===1&&ch("Link da proposta")){title="Proposta pronta";L.push(`O CS anexou a proposta de Bioprecisão${after["Valor da proposta (R$)"]?" ("+brl(after["Valor da proposta (R$)"])+(after["Nº de amostras"]?", "+after["Nº de amostras"]+" amostras":"")+")":""}. Apresente ao cliente e formalize a aprovação.`)}
 if(i===3&&(ch("Data prevista da coleta")||ch("Empresa amostradora"))){title=title||"Coleta agendada";L.push(`Coleta prevista para ${fmtDate(after["Data prevista da coleta"])||"data a definir"}${after["Empresa amostradora"]?" com "+samplerName(db,after["Empresa amostradora"]):""}.`)}
 if(i===3&&ch("Coleta concluída")){title=title||"Coleta concluída";L.push("A coleta foi concluída e as amostras seguem para o laboratório.")}
 if(i===4&&ch("Data de chegada em Campinas")){title=title||"Amostras no laboratório";L.push(`Amostras chegaram ao laboratório em ${fmtDate(after["Data de chegada em Campinas"])}. Prazo da análise: ${fmtDate(analysisDue({cs:{4:after}}))}.`)}
 if(i===4&&ch("Amostras recebidas"))L.push("Recebimento: "+after["Amostras recebidas"]+".");
 CHECKS5.slice(0,3).forEach(k=>{if(i===4&&ch(k))L.push(k+" feito.")});
 if(i===4&&ch("Laudo pronto")){title="Resultados prontos";L.push("O laudo está pronto. Prepare a entrega técnica com o CS.")}
 if(i===4&&ch("Entrega técnica marcada para")){title=title||"Entrega técnica marcada";L.push(`Entrega técnica marcada para ${fmtDate(after["Entrega técnica marcada para"])}.`)}
 if(ch("Mensagem para o vendedor")){title=title||"Mensagem do CS";L.push("💬 "+after["Mensagem para o vendedor"])}
 if(!L.length){const k=Object.keys(after).filter(ch);if(!k.length)return null;L.push("Atualizado: "+k.join(", ")+".")}
 return {title:(title||"Atualização do CS")+" · "+c.nome,body:L.join(" "),stage:i+1}}

const outBtn='<button class="btn ghost" id="aOut" style="margin-top:10px;width:100%">Sair</button>';
function bindOut(){const o=document.getElementById("aOut");if(o)o.onclick=logout}
async function logout(){await sb.auth.signOut();location.reload()}
function aMsg(t,ok){const m=document.getElementById("aMsg");if(m){m.textContent=t;m.style.color=ok?"#274820":"#b3261e"}}

async function boot(start,opts={}){
 if(!EO_CONFIG.anonKey||/COLE_AQUI/.test(EO_CONFIG.anonKey)){authBox(`<h2>Configuração pendente</h2><p>Falta colar a chave pública do Supabase no arquivo <b>config.js</b>.</p>`);return}
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginForm(start,opts);
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(error||!p){authBox(`<h2>Perfil não encontrado</h2><p>${esc(error?error.message:"Fale com o gestor.")}</p>${outBtn}`);bindOut();return}
  ME=p;
  if(!p.ativo){authBox(`<h2>Acesso aguardando liberação</h2><p>Seu usuário ainda não está ativo. Fale com o gestor do CS.</p>${outBtn}`);bindOut();return}
  if(p.trocar_senha)return pwForm(start,opts);
  if(opts.gestor&&p.papel!=="gestor"){location.replace("caderno.html");return}
  authBox(`<p style="text-align:center">Carregando dados…</p>`);
  db=await loadDb();
  document.getElementById("auth").style.display="none";
  start();
 }catch(e){authBox(`<h2>Não foi possível conectar</h2><p>${esc(e.message||e)}</p><button class="btn" onclick="location.reload()" style="width:100%">Tentar de novo</button>${outBtn}`);bindOut()}
}
async function loginForm(start,opts){
 let first=false;try{const {data}=await sb.rpc("has_users");first=data===false}catch(e){}
 if(first){
  authBox(`<h2>Configurar o primeiro gestor</h2><p class="note">Ainda não há usuários. Este primeiro cadastro vira o gestor do CS, que cria os demais usuários no painel.</p>
  <label>Nome</label><input id="aNome"><label>E-mail</label><input id="aEmail" type="email" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input id="aPw" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="aPw2" type="password" autocomplete="new-password">

 res.forEach(r=>{if(r.error)throw r.error});

  consultorias:a.data.map(x=>({...x.data,id:x.id})),samplers:s.data.map(x=>({...x.data,id:x.id})),records:r.data.map(x=>({...x.data,id:x.id,cid:x.client_id}))};
 SNAP={};TABLES.forEach(t=>{SNAP[t]={};d[t].forEach(x=>SNAP[t][x.id]=JSON.stringify(ROW[t](x)))});
 const paths=d.records.flatMap(x=>(x.files||[]).map(f=>f.path)).filter(x=>x&&!FILEURL[x]);
 if(paths.length){const {data}=await sb.storage.from("anexos").createSignedUrls(paths,7*24*3600);(data||[]).forEach(u=>{if(u.signedUrl)FILEURL[u.path]=u.signedUrl})}
 const ap=d.clients.flatMap(c=>[c.kml,...Object.values(c.kmlExp||{})]).filter(k=>k&&k.path&&!DLURL[k.path]).map(k=>k.path);

 LOADED_AT=Date.now();return d}
/* arquivo da área (qualquer formato): vai para o armazenamento e fica disponível para download */
async function uploadAreaFile(cid,f){const safe=f.name.normalize("NFD").replace(/[^\w.\-]/g,"_");const path=`${cid}/area/${Date.now()}_${safe}`;
 const {error}=await sb.storage.from("anexos").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:true});if(error)throw error;
 let geo=null;if(/\.kml$/i.test(f.name)&&f.size<8e6){try{geo=kmlCenter(await f.text())}catch(e){}}
 const u=await sb.storage.from("anexos").createSignedUrl(path,7*24*3600,{download:f.name});if(u.data)DLURL[path]=u.data.signedUrl;
 return {name:f.name,type:f.type||"",size:f.size,path,at:new Date().toISOString(),geo}}

let syncing=Promise.resolve();
function setSync(t,err){const e=document.getElementById("sync");if(e){e.textContent=t;e.style.color=err?"#ffb4a8":""}}
function persist(msg){syncing=syncing.then(()=>syncDb(msg));return true}
async function syncDb(msg){
 const up={},del={};TABLES.forEach(t=>{up[t]=[];del[t]=[];const cur={};
  (db[t]||[]).forEach(x=>{const row=ROW[t](x);const j=JSON.stringify(row);cur[x.id]=1;if(SNAP[t][x.id]!==j)up[t].push([x.id,row,j])});
  Object.keys(SNAP[t]).forEach(id=>{if(!cur[id]&&!cur[+id])del[t].push(id)})});
 if(!TABLES.some(t=>up[t].length||del[t].length)){if(msg)toast(msg);return}
 setSync("salvando…");
 try{
  for(const t of TABLES){if(!up[t].length)continue;const {error}=await sb.from(t).upsert(up[t].map(x=>x[1]));if(error)throw error;up[t].forEach(([id,,j])=>SNAP[t][id]=j)}
  for(const t of ["records","clients","consultorias","samplers"]){if(!del[t].length)continue;const {error}=await sb.from(t).delete().in("id",del[t]);if(error)throw error;del[t].forEach(id=>delete SNAP[t][id])}
  setSync("salvo ✓");if(msg)toast(msg);
 }catch(e){setSync("erro ao salvar",1);toast("Não foi possível salvar: "+(e.message||e))}
}

 const path=`${cid}/${rid}/${k}_${safe}`;const {error}=await sb.storage.from("anexos").upload(path,blob,{contentType:f.type,upsert:true});if(error)throw error;
 FILEURL[path]=f.data;return {name:f.name,type:f.type,path}}

function deadlineHTML(c){const p=propDeadline(c);
 if(!p)return `<div class="dl wait"><b>Aguardando o KML</b>Anexe o KML na etapa 1 para o CS iniciar a proposta.</div>`;
 if(p.done){const v=c.cs[1]||{};return `<div class="dl ok"><b>Proposta disponível</b><a href="${esc(v["Link da proposta"])}" target="_blank">Abrir proposta de Bioprecisão ↗</a><div>${v["Valor da proposta (R$)"]?"Valor: "+brl(v["Valor da proposta (R$)"]):""}${v["Nº de amostras"]?" · "+v["Nº de amostras"]+" amostras":""}</div></div>`}
 const h=Math.round(p.left);return h>=0?`<div class="dl wait"><b>Proposta em preparação pelo CS</b>KML enviado em ${fmtDT(c.kmlAt)}. Prazo: ${fmtDT(p.dl)} · faltam ${h} h.</div>`:`<div class="dl late"><b>Proposta atrasada</b>O prazo de 48 h venceu em ${fmtDT(p.dl)} (há ${-h} h). Fale com o CS.</div>`}

function clientView(c){
 const i=c.stage-1;const free=isGestor();const recs=db.records.filter(r=>r.cid===c.id&&r.stage===c.stage);
 const autoOk=(i===3&&!!c.cs[3]?.["Coleta concluída"])||(i===4&&["Contato 1 · Introdução à metagenômica","Contato 2 · Books","Contato 3 · Como ler os resultados","Laudo pronto"].every(k=>c.cs[4]?.[k]));
 $("#bar").style.display="flex";
 $("#bar").innerHTML=`${FIELDS[i].length?`<button class="btn ghost" id="saveSt">Salvar</button>`:""}<button class="btn or" id="adv" ${autoOk||free?"":"disabled"}>${c.stage<8?"Avançar → etapa "+(c.stage+1):"Concluir ciclo"}</button>`;
 const prev=STAGES.slice(0,i).map((s,k)=>{const a=c.ans[k]||{};const ent=Object.entries(a).filter(([x,v])=>v&&v!=="—");const r=renderRecords(db,c.id,k+1);
   return `<details class="prev"><summary>${k+1}. ${s}</summary>${ent.map(([x,v])=>`<div class="ans"><span>${esc(x)}:</span> ${esc(v)}</div>`).join("")}${csInfoHTML(db,c,k)}${r}${!ent.length&&!r&&!csInfoHTML(db,c,k)?'<div class="ans"><span>Sem registros.</span></div>':""}</details>`}).join("");
 const csOnly=FIELDS[i].length===0;
 $("#main").innerHTML=`<span id="back" style="color:#0b87ba;font-weight:600;cursor:pointer">← Meus clientes</span>
 <h1 style="margin-top:8px">${esc(c.nome)}</h1>
 <div style="font-size:12.5px;color:var(--mut)">${esc(c.uf)}${c.agencia?" · "+esc(agName(db,c.agencia)):""} ${c.kml?`<span class="kml">· ${dlLink(c.kml)}</span>`:""}</div>
 <div class="stepper">${STAGES.map((_,k)=>`<div class="${k<i?"done":k===i?"cur":""}"></div>`).join("")}</div>
 ${free?`<label style="margin-top:6px">Gestor: mover para a etapa</label><select id="jump">${STAGES.map((s,k)=>`<option value="${k+1}" ${k===i?"selected":""}>${k+1}. ${s}</option>`).join("")}</select>`:""}
 <div class="stagehead">Etapa ${c.stage} · ${STAGES[i]}</div>
 ${i===1?deadlineHTML(c):""}
 ${csInfoHTML(db,c,i)}
 ${csOnly?`<p class="note">Esta etapa é conduzida pelo CS. Você acompanha aqui o que já foi feito; o avanço é liberado quando o CS conclui.</p>`:""}
 ${fieldsHTML(c,i)}
 <details class="box"><summary>Registros desta etapa (${recs.length})</summary>
  ${renderRecords(db,c.id,c.stage)||'<p class="note">Nenhum registro ainda.</p>'}
  <div class="addbox">
   <label>Título</label><input id="rTitle" placeholder="Ex.: Zona 2, raízes com lesões">
   <label>Anexos (qualquer arquivo; vários de uma vez)</label><input type="file" id="rFiles" multiple>
   <label>Observação</label><textarea id="rText"></textarea>
   <button class="btn sm" id="addRec" style="margin-top:8px">Adicionar registro</button>
  </div>
 </details>
 ${csOnly?"":`<div class="crit"><input type="checkbox" id="crit" ${autoOk?"checked":""}><div><b>Critério de saída:</b> ${CRIT[i]}</div></div>`}
 ${prev?`<h2>Etapas anteriores</h2>${prev}`:""}`;
 $("#back").onclick=()=>{openId=null;render()};
 const collect=()=>{c.ans[i]=c.ans[i]||{};document.querySelectorAll("[data-l]").forEach(e=>{c.ans[i][e.dataset.l]=e.dataset.multi?[...e.querySelectorAll("input:checked")].map(x=>x.value).join(", "):e.value})};
 const crit=$("#crit"),adv=$("#adv");if(crit)crit.onchange=()=>adv.disabled=!free&&!crit.checked;
 const js=$("#jump");if(js)js.onchange=()=>{const st=+js.value;c.stage=st;c.hist.push({stage:st,date:todayISO(),by:seller+" (gestor)"});c.upd=todayISO();persist();toast("Cliente movido para a etapa "+st);clientView(c);scrollTo(0,0)};
 const apv=document.querySelector('[data-l="Aprovação formalizada"]');if(apv){const upd=()=>{if(!free&&!c.cs[1]?.["Link da proposta"]){adv.textContent="Aguardando a proposta do CS";adv.disabled=true;return}const no=apv.value==="Não";adv.textContent=no?"Mover para Leads":"Avançar → etapa 3";adv.classList.toggle("red",no);if(no||free)adv.disabled=false;else adv.disabled=!(crit&&crit.checked)};apv.onchange=upd;upd()}
 const doSave=async()=>{collect();c.kmlExp=c.kmlExp||{};
  try{toast("Enviando arquivo…");await flush();
   for(const e of document.querySelectorAll("[data-kx]")){const f=e.files[0];if(!f)continue;c.kmlExp[e.dataset.kx]=await uploadAreaFile(c.id,f);c.ans[i][e.dataset.kx]=f.name}
   const k=$("#kmlUp");if(k&&k.files[0])await takeKml(c,k.files[0]);
  }catch(err){toast("Não foi possível enviar o arquivo: "+(err.message||err));return false}c.upd=todayISO();c.vAt=new Date().toISOString();const ms=processOffers(db,c,seller);persist();ms.forEach((m,k)=>setTimeout(()=>toast(m),k*2400));return true};
 const sv=$("#saveSt");if(sv)sv.onclick=async()=>{if(!await doSave())return;if(!isActive(c)){openId=null;tab="fin";render();scrollTo(0,0);return}toast("Etapa salva");clientView(c)};
 adv.onclick=async()=>{if(!free&&i===1&&!c.cs[1]?.["Link da proposta"]){toast("A proposta ainda não foi anexada pelo CS");return}if(!await doSave())return;
  if(!isActive(c)){openId=null;tab="fin";render();scrollTo(0,0);return}
  if(!free&&i===0&&!c.kml){toast("Anexe o arquivo da área antes de avançar");return}
  if(i===1&&c.ans[1]["Aprovação formalizada"]==="Não"){Object.assign(c,{status:"lead",leadOrigem:"Proposta recusada (1ª oferta)",leadMotivo:c.ans[1]["Motivo da recusa (se não)"]||"",leadDate:todayISO()});persist();toast("Proposta recusada: cliente movido para Leads");openId=null;tab="fin";render();return}
  if(!free&&i===5&&(!c.ans[5]["Oferta de expansão"]||c.ans[5]["Oferta de expansão"]==="—")){toast("Registre a oferta de expansão antes de avançar");return}
  if(!free&&i===5&&c.ans[5]["Oferta de expansão"]==="Aceitou"&&!c.kmlExp["KML das novas áreas"]){toast("Anexe o arquivo das novas áreas para fechar a expansão");return}
  c.stage=c.stage<8?c.stage+1:3;c.hist.push({stage:c.stage,date:todayISO(),by:seller});persist();toast(i===7?"Novo ciclo: volta à etapa 3":"Avançou para a etapa "+c.stage);clientView(c);scrollTo(0,0)};
 $("#addRec").onclick=async()=>{collect();const title=$("#rTitle").value.trim(),text=$("#rText").value.trim();const fl=[...$("#rFiles").files];
  if(!fl.length&&!text){toast("Adicione um anexo ou uma observação");return}
  const files=[];for(const f of fl){if(f.type.startsWith("image/")){const d=await shrink(f);if(d)files.push({name:f.name,type:"image/jpeg",data:d})}else{if(f.size>10e6){toast(`${f.name} passa de 10 MB e ficou de fora`);continue}files.push({name:f.name,type:f.type||"application/octet-stream",data:await readURL(f)})}}
  const rid="r"+Date.now();await flush();const up=[];
  for(const [k,f] of files.entries()){try{up.push(await uploadFile(c.id,rid,k,f))}catch(e){toast("Falha ao enviar "+f.name+": "+e.message)}}
  db.records.push({id:rid,cid:c.id,stage:c.stage,title,text,files:up,by:seller,date:todayISO()});
  c.upd=todayISO();c.vAt=new Date().toISOString();persist();toast("Registro adicionado");clientView(c);const d=document.querySelector("details.box");if(d)d.open=true};
}
boot(async()=>{setupHeader();await loadNotifs();lastUnread=unread();render()});
</script>
</body>
</html>
