<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CS 2027 · EarthOptics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#274820;--g2:#426b4f;--br:#9fc55a;--brown:#622a10;--clay:#b06c52;--or:#f2944c;--sand:#edb381;--warm:#ebe3df;--ink:#1a1a1a;--mut:#666}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:#f7f4f2;font-size:14px}
a{color:#0b87ba;font-weight:600;text-decoration:none}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;background:var(--warm);color:var(--g)}
.chip.s6{background:var(--sand)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.or{background:var(--or)}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;color:var(--g);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d8d0cb;border-radius:8px;background:#fff}
textarea{min-height:60px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
.rec{border:1px solid #e8e1dc;border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
.rec .rh{font-size:12.5px}.rec .rh span{color:var(--mut);font-size:11px}
.rec img{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;display:block}
.rec audio{width:100%;margin-top:6px}
.rec .rt{font-size:13px;margin-top:4px;white-space:pre-wrap}
.stepper{display:flex;gap:3px;margin:8px 0 12px}
.stepper div{flex:1;height:6px;border-radius:3px;background:var(--warm)}
.stepper div.done{background:var(--g2)}.stepper div.cur{background:var(--or)}
.fchip{display:inline-block;background:var(--warm);border-radius:8px;padding:5px 10px;font-size:12px;margin-top:6px}
.csbox{background:#eef4ec;border-left:4px solid var(--g2);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.csbox .cst{font-weight:700;color:var(--g2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.csbox span{color:var(--mut)}
.csbox .ck{margin:3px 0;color:#888}.csbox .ck.on{color:var(--g);font-weight:600}
.csbox .msg{margin-top:6px;background:#fff;border-radius:6px;padding:6px 8px}
details.box{border:1px solid #e3ddd8;border-radius:10px;padding:8px 12px;margin:12px 0;background:#fff}
details.box>summary{font-weight:700;color:var(--g);cursor:pointer;font-size:14px}
.multi{display:flex;gap:6px;flex-wrap:wrap}
.multi label{display:flex;align-items:center;gap:6px;margin:0;border:1px solid #d8d0cb;border-radius:20px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--g)}
.multi input{width:auto;margin:0}
.dl{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.dl.ok{background:#eef4ec;border-left:4px solid var(--g2)}
.dl.wait{background:#fdf3ea;border-left:4px solid var(--or)}
.dl.late{background:#fbeeea;border-left:4px solid var(--clay)}
.dl b{display:block;font-size:14px;color:var(--g)}

#auth{position:fixed;inset:0;background:var(--g);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.authw{width:100%;max-width:380px;text-align:center;color:#ffffffaa}
.alogo{height:40px;margin:0 auto 18px;display:block}
.authc{background:#fff;border-radius:16px;padding:22px 22px 16px;text-align:left;color:#222;margin-bottom:12px}
.authc h2{color:var(--g);margin:0 0 10px;font-size:18px}
.authc .note{font-size:12.5px;color:var(--mut)}

header{background:var(--g);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header .logo{display:flex;align-items:center;gap:12px;font-weight:700}header .logo img{height:34px;display:block}header .logo span{border-left:1px solid #ffffff55;padding-left:12px}
nav{display:flex;gap:6px}
nav button{background:transparent;border:1px solid #ffffff55;color:#fff;padding:7px 16px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--or);border-color:var(--or)}
.hright{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px}
.hright a{color:#fff;border:1px solid #ffffff77;border-radius:16px;padding:5px 12px}
.hright button{background:transparent;border:0;color:#ffffffaa;font:inherit;font-size:11px;cursor:pointer;text-decoration:underline}
main{padding:22px;max-width:1320px;margin:0 auto}
h1{color:var(--g);font-size:22px;margin:0 0 14px}
h2{color:var(--g);font-size:16px;margin:18px 0 8px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigc{background:#fff;border-radius:12px;padding:14px 18px;border:1px solid #e3ddd8}
.bigc.f{border-top:5px solid var(--g2)}.bigc.a{border-top:5px solid var(--or)}
.bigc .t{font-weight:700;color:var(--g);font-size:14px;margin-bottom:8px}
.bigc .row3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.bigc .k{font-size:24px;font-weight:700;color:var(--g)}.bigc .v{font-size:11.5px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.kpi{background:#fff;border-radius:10px;padding:12px 16px;border:1px solid #e3ddd8}
.kpi .k{font-size:22px;font-weight:700;color:var(--g)}.kpi .v{font-size:12px;color:var(--mut)}
.card{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #e3ddd8}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.bar .l{width:190px;font-size:12px}.bar .t{flex:1;background:var(--warm);border-radius:6px;height:20px}
.bar .f{background:var(--g2);height:100%;border-radius:6px}.bar .n{width:26px;text-align:right;font-weight:600}
.bar .val{width:110px;text-align:right;font-size:12px;color:var(--g2);font-weight:600}
.barh{display:flex;gap:8px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--g);color:#fff;text-align:left;padding:7px 8px;font-weight:600}
td{padding:6px 8px;border-bottom:1px solid #eee}
tr:nth-child(even) td{background:#faf7f5}
td.c,th.c{text-align:center}td.r,th.r{text-align:right}
.alert{padding:8px 10px;border-left:4px solid var(--clay);background:#fbf4f1;margin:6px 0;font-size:12.5px;cursor:pointer}
.link{cursor:pointer;color:#0b87ba;font-weight:600}
.cols{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}.cols.closed{grid-template-columns:1fr}
.list{max-height:82vh;overflow:auto;position:sticky;top:10px}
.li{padding:9px 10px;border-bottom:1px solid #eee;cursor:pointer}
.li.on{background:var(--warm)}
.li.ncs{border-left:4px solid #b3261e}.li.ncs b{color:#b3261e}.li.nv{border-left:4px solid var(--or)}
.need{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:2px}.need.r{color:#b3261e}.need.o{color:#c86a1e}
.doc{font-size:11.5px;font-weight:600;color:#0b6fa0;margin-left:4px;white-space:nowrap}
.bar.sel .l{color:var(--or);font-weight:700}
.dlk{color:#0b6fa0;font-weight:600;word-break:break-all}
.mv{margin-left:auto;font-size:11.5px;font-weight:600}
th[data-arrow]::after{content:attr(data-arrow);font-size:10px}
.rep{background:#fff;border-radius:14px;padding:26px 32px;border:1px solid #e3ddd8;max-width:1100px;margin:0 auto}
.rh{display:flex;justify-content:space-between;align-items:flex-start}.rh h1{font-size:30px;margin:0;color:var(--g)}.rs{color:var(--mut);font-size:13px;margin-top:2px}.rsign{height:44px}
.rep h2{color:var(--g);font-size:18px;margin:20px 0 8px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rc{background:var(--warm);border-radius:10px;padding:10px 14px}
.rl{font-size:11.5px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.03em}.rk{font-size:30px;font-weight:700;color:var(--g);line-height:1.2}.rk.or,.rqv.or{color:var(--or)}.rv{font-size:12px;color:var(--mut)}
.meta-in{border:0;border-bottom:2px dashed #cfc4bd;background:transparent;font:inherit;font-weight:700;color:var(--g);width:140px;padding:0}.meta-in.sm{width:60px;font-size:11px;font-weight:600}
.rn{font-size:13px;font-style:italic;color:var(--g2);margin:8px 0 0}.rn span{color:var(--mut)}
.rytd{margin:0 0 6px;font-weight:600}.rytd b{color:var(--or)}.rytd span{color:var(--mut);font-weight:400}
.rq{display:grid;grid-template-columns:130px 1fr 150px;gap:14px;align-items:center;margin:8px 0}
.rql{font-weight:700;color:var(--g)}.rql small,.rqv small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.rqt{position:relative;background:#e9e6e3;border-radius:6px;height:22px}.rqf{background:var(--g2);height:100%;border-radius:6px;max-width:100%}.rqf.ok{background:var(--g)}.rqf.cur{background:var(--or)}
.rqm{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed #274820}
.rqv{text-align:right;font-weight:700;color:var(--g)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rf{display:grid;grid-template-columns:180px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}.rf div{background:#e9e6e3;border-radius:5px;height:14px}.rf i{display:block;height:100%;background:var(--g2);border-radius:5px}.rf b{text-align:right}
.rw{font-size:13px;padding:5px 0;border-bottom:1px solid #f0ebe7}.rw b{color:var(--g)}
.rt{width:100%;margin-top:4px}.rfoot{font-size:11.5px;font-style:italic;color:var(--mut);margin-top:14px}
@media print{header,.noprint{display:none!important}body{background:#fff}main{padding:0}.rep{border:0;padding:0}.meta-in{border:0}@page{size:A4 landscape;margin:12mm}}
.legend{font-size:11.5px;color:var(--mut);margin:0 0 6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.r{background:#b3261e}.dot.o{background:var(--or);margin-left:8px}
.needbox{background:#fbe9e7;border-left:4px solid #b3261e;padding:8px 12px;border-radius:8px;margin-top:10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip.won{background:#9fc55a;color:#274820}.chip.rc{background:#ebe3df;color:#622a10}
.li b{color:var(--g);font-size:13px}.li small{display:block;color:var(--mut);font-size:11.5px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{border:1px solid #e3ddd8;border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}
.st>summary{padding:10px 14px;cursor:pointer;font-weight:700;color:var(--g);display:flex;gap:8px;align-items:center}
.st.cur>summary{background:#fdf3ea}.st.fut>summary{color:#5d6f5f}
.st .in{padding:4px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st .in h4{margin:8px 0 4px;font-size:12px;color:var(--g2);text-transform:uppercase;letter-spacing:.06em}
.ans{font-size:12.5px;background:#faf7f5;border-radius:8px;padding:6px 10px}.ans span{color:var(--mut)}
.csform{background:#eef4ec;border-radius:10px;padding:8px 12px}
.csform label{margin-top:6px}
.ckrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.ckrow input{width:18px;height:18px}
.sug{font-size:12px;background:#fff;border-radius:6px;padding:6px 8px;margin-top:6px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.form4{display:grid;grid-template-columns:2fr 1.4fr .6fr .8fr .8fr 1.2fr auto;gap:8px;align-items:end}
@media(max-width:1000px){.big,.kpis,.grid2,.cols,.meta,.st .in{grid-template-columns:1fr}}
</style>
</head>

function processOffers(db,c,by){const msgs=[];c.spawn=c.spawn||{};c.kmlExp=c.kmlExp||{};

/* KML: centro da área a partir das coordenadas */
function kmlCenter(txt){if(!txt)return null;const m=[...txt.matchAll(/<coordinates>([\s\S]*?)<\/coordinates>/g)];let la=0,lo=0,n=0;
 m.forEach(x=>x[1].trim().split(/\s+/).forEach(t=>{const p=t.split(",");const a=+p[1],o=+p[0];if(!isNaN(a)&&!isNaN(o)){la+=a;lo+=o;n++}}));return n?{lat:la/n,lon:lo/n}:null}
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rankSamplers(db,c){if(!c.geo)return db.samplers.map(s=>({s,d:null}));return db.samplers.map(s=>({s,d:distKm(c.geo,s)})).sort((x,y)=>x.d-y.d)}

const outBtn='<button class="btn ghost" id="aOut" style="margin-top:10px;width:100%">Sair</button>';
function bindOut(){const o=document.getElementById("aOut");if(o)o.onclick=logout}
async function logout(){await sb.auth.signOut();location.reload()}
function aMsg(t,ok){const m=document.getElementById("aMsg");if(m){m.textContent=t;m.style.color=ok?"#274820":"#b3261e"}}

async function boot(start,opts={}){
 if(!EO_CONFIG.anonKey||/COLE_AQUI/.test(EO_CONFIG.anonKey)){authBox(`<h2>Configuração pendente</h2><p>Falta colar a chave pública do Supabase no arquivo <b>config.js</b>.</p>`);return}
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginForm(start,opts);
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(error||!p){authBox(`<h2>Perfil não encontrado</h2><p>${esc(error?error.message:"Fale com o gestor.")}</p>${outBtn}`);bindOut();return}
  ME=p;
  if(!p.ativo){authBox(`<h2>Acesso aguardando liberação</h2><p>Seu usuário ainda não está ativo. Fale com o gestor do CS.</p>${outBtn}`);bindOut();return}
  if(p.trocar_senha)return pwForm(start,opts);
  if(opts.gestor&&p.papel!=="gestor"){location.replace("caderno.html");return}
  authBox(`<p style="text-align:center">Carregando dados…</p>`);
  db=await loadDb();
  document.getElementById("auth").style.display="none";
  start();
 }catch(e){authBox(`<h2>Não foi possível conectar</h2><p>${esc(e.message||e)}</p><button class="btn" onclick="location.reload()" style="width:100%">Tentar de novo</button>${outBtn}`);bindOut()}
}
async function loginForm(start,opts){
 let first=false;try{const {data}=await sb.rpc("has_users");first=data===false}catch(e){}
 if(first){
  authBox(`<h2>Configurar o primeiro gestor</h2><p class="note">Ainda não há usuários. Este primeiro cadastro vira o gestor do CS, que cria os demais usuários no painel.</p>
  <label>Nome</label><input id="aNome"><label>E-mail</label><input id="aEmail" type="email" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input id="aPw" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="aPw2" type="password" autocomplete="new-password">

async function syncDb(msg){
 const up={},del={};TABLES.forEach(t=>{up[t]=[];del[t]=[];const cur={};
  (db[t]||[]).forEach(x=>{const row=ROW[t](x);const j=JSON.stringify(row);cur[x.id]=1;if(SNAP[t][x.id]!==j)up[t].push([x.id,row,j])});
  Object.keys(SNAP[t]).forEach(id=>{if(!cur[id]&&!cur[+id])del[t].push(id)})});
 if(!TABLES.some(t=>up[t].length||del[t].length)){if(msg)toast(msg);return}
 setSync("salvando…");
 try{
  for(const t of TABLES){if(!up[t].length)continue;const {error}=await sb.from(t).upsert(up[t].map(x=>x[1]));if(error)throw error;up[t].forEach(([id,,j])=>SNAP[t][id]=j)}
  for(const t of ["records","clients","consultorias","samplers"]){if(!del[t].length)continue;const {error}=await sb.from(t).delete().in("id",del[t]);if(error)throw error;del[t].forEach(id=>delete SNAP[t][id])}
  setSync("salvo ✓");if(msg)toast(msg);
 }catch(e){setSync("erro ao salvar",1);toast("Não foi possível salvar: "+(e.message||e))}
}

  </div>
  <h2>Por vendedor</h2>
  <table class="rt"><tr><th>Vendedor</th><th class="c">Clientes ativos</th><th class="r">Fechado (amostras)</th><th class="r">Fechado (R$)</th><th class="r">${MES} (amostras)</th><th class="r">Aberto (amostras)</th><th class="r">Aberto (R$)</th></tr>
  ${sel.map(x=>`<tr><td><b>${esc(x.p.nome)}</b></td><td class="c">${x.ativos}</td><td class="r">${fmt(x.fa)}</td><td class="r">${brl(x.fv)}</td><td class="r">${fmt(x.fm)}</td><td class="r">${fmt(x.oa)}</td><td class="r">${brl(x.ov)}</td></tr>`).join("")}</table>
  <p class="rfoot">${MES} em andamento: ${metaM?"meta de "+fmt(metaM)+"; ":""}realizado até agora: ${fmt(realM)} amostras. Fechado = cliente que passou da etapa 2 (proposta aprovada), contado na data em que entrou na etapa 3.</p>
 </div>`;
 $("#back").onclick=()=>{view="painel";render()};
 document.querySelectorAll(".meta-in").forEach(e=>e.onchange=async()=>{await setMeta(e.dataset.mk,e.value);relatorio()});
}
function consultorias(){
 const A=db.consultorias.slice().sort((a,b)=>a.nome.localeCompare(b.nome));const e=db.consultorias.find(a=>a.id===agEdit)||{};
 const sum=(a,f)=>a.reduce((s,c)=>s+f(c),0);
 $("#main").innerHTML=`<h1>Consultorias e agências</h1>
 <p style="color:var(--mut);margin-top:-6px">Lista que aparece para o vendedor no caderno de campo. O vendedor também pode cadastrar uma agência nova em campo; ela entra aqui marcada como criada pelo vendedor, para você revisar. As agências abaixo são exemplos: substitua pela base real.</p>
 <div class="card"><table><tr><th>Agência</th><th>Cidade</th><th>UF</th><th>Contato</th><th>Telefone</th><th>E-mail</th><th class="c">Clientes</th><th class="r">Fechado</th><th>Criada por</th><th></th></tr>
 ${A.map(a=>{const cs=db.clients.filter(c=>c.agencia===a.id);return `<tr><td><b>${esc(a.nome)}</b></td><td>${esc(a.cidade)}</td><td>${esc(a.uf)}</td><td>${esc(a.contato)}</td><td>${esc(a.tel)}</td><td>${esc(a.email)}</td><td class="c">${cs.length}</td><td class="r">${brl(sum(cs.filter(c=>c.stage>=3),closedValue))}</td><td>${a.by==="CS"?"CS":`<span class="chip s6">${esc(a.by)}</span>`}</td><td><span class="link" data-ed="${a.id}">editar</span> · <span class="link" data-rm="${a.id}">remover</span></td></tr>`}).join("")||'<tr><td colspan="10">Nenhuma agência cadastrada.</td></tr>'}
 </table>
 <h2>${agEdit?"Editar agência":"Adicionar agência"}</h2>
 <div class="form4" style="grid-template-columns:2fr 1.3fr .6fr 1.3fr 1.1fr 1.4fr auto"><div><label>Agência</label><input id="aN" value="${esc(e.nome||"")}"></div><div><label>Cidade</label><input id="aC" value="${esc(e.cidade||"")}"></div><div><label>UF</label><input id="aU" maxlength="2" value="${esc(e.uf||"")}"></div><div><label>Contato</label><input id="aT" value="${esc(e.contato||"")}"></div><div><label>Telefone</label><input id="aF" value="${esc(e.tel||"")}"></div><div><label>E-mail</label><input id="aE" type="email" value="${esc(e.email||"")}"></div>
 <div style="display:flex;gap:6px">${agEdit?'<button class="btn ghost" id="aX">Cancelar</button>':""}<button class="btn" id="aS">${agEdit?"Salvar":"Adicionar"}</button></div></div></div>`;
 $("#aS").onclick=()=>{const n=$("#aN").value.trim();if(!n){toast("Informe o nome da agência");return}
  const d={nome:n,cidade:$("#aC").value.trim(),uf:$("#aU").value.trim().toUpperCase(),contato:$("#aT").value.trim(),tel:$("#aF").value.trim(),email:$("#aE").value.trim()};
  if(agEdit){Object.assign(db.consultorias.find(a=>a.id===agEdit),d,{by:"CS"});agEdit=null;persist("Agência atualizada")}else{db.consultorias.push({id:"a"+Date.now(),...d,by:"CS"});persist("Agência adicionada")}consultorias()};
 const x=$("#aX");if(x)x.onclick=()=>{agEdit=null;consultorias()};
 document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{agEdit=b.dataset.ed;consultorias();$("#aN").focus()});
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;db.consultorias=db.consultorias.filter(a=>a.id!==id);db.clients.forEach(c=>{if(c.agencia===id)c.agencia=""});persist("Agência removida");consultorias()});
}
function usuarios(){
 const P=PROFILES.slice().sort((a,b)=>(b.ativo-a.ativo)||a.nome.localeCompare(b.nome));const e=PROFILES.find(x=>x.id===uEdit)||{};
 const act=uAct&&PROFILES.find(x=>x.id===uAct.id);
 $("#main").innerHTML=`<h1>Usuários</h1>
 <p style="color:var(--mut);margin-top:-6px"><b>Vendedor</b> usa o caderno de campo e vê só os próprios clientes. <b>Gestor</b> vê todos os clientes, usa o painel e cria usuários. Quem é criado aqui entra com a senha provisória e troca a senha no primeiro acesso.</p>
 <div class="card"><table><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Situação</th><th class="c">Clientes</th><th>Senha</th><th></th></tr>
 ${P.map(u=>`<tr style="${u.ativo?"":"opacity:.55"}"><td><b>${esc(u.nome)}</b>${u.id===ME.id?' <span class="chip">você</span>':""}</td><td>${esc(u.email)}</td><td><span class="chip ${u.papel==="gestor"?"s6":""}">${u.papel}</span></td><td>${u.ativo?"Ativo":"Desativado"}</td><td class="c">${db.clients.filter(c=>c.sellerId===u.id).length}</td><td>${u.trocar_senha?'<span style="color:var(--clay)">provisória</span>':"definida"}</td>
  <td><span class="link" data-ue="${u.id}">editar</span> · <span class="link" data-ua="${u.id}">${u.ativo?"desativar":"ativar"}</span> · <span class="link" data-upw="${u.id}">redefinir senha</span> · <span class="link" data-utr="${u.id}">transferir clientes</span></td></tr>`).join("")}
 </table>
 ${act?`<div class="needbox" style="background:var(--warm);border-color:var(--or)">${uAct.type==="pw"?`<span>Nova senha provisória para <b>${esc(act.nome)}</b>:</span><input id="uNp" type="text" style="max-width:220px" placeholder="mínimo 6 caracteres"><button class="btn sm" id="uDo">Redefinir</button>`:`<span>Transferir os clientes de <b>${esc(act.nome)}</b> para:</span><select id="uTo" style="max-width:240px">${PROFILES.filter(x=>x.ativo&&x.id!==act.id).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select><button class="btn sm" id="uDo">Transferir</button>`}<button class="btn sm ghost" id="uX">Cancelar</button></div>`:""}
 <h2>${uEdit?"Editar usuário":"Novo usuário"}</h2>
 <div class="form4" style="grid-template-columns:1.6fr 1.8fr 1fr 1.3fr auto"><div><label>Nome</label><input id="uN" value="${esc(e.nome||"")}"></div>
  <div><label>E-mail</label><input id="uE" type="email" value="${esc(e.email||"")}" ${uEdit?"disabled":""}></div>
  <div><label>Papel</label><select id="uP">${["vendedor","gestor"].map(x=>`<option ${x===(e.papel||"vendedor")?"selected":""}>${x}</option>`).join("")}</select></div>
  <div>${uEdit?"":`<label>Senha provisória</label><input id="uS" type="text" placeholder="mínimo 6 caracteres">`}</div>
  <div style="display:flex;gap:6px">${uEdit?'<button class="btn ghost" id="uC">Cancelar</button>':""}<button class="btn" id="uSave">${uEdit?"Salvar":"Criar usuário"}</button></div></div>
 <small style="color:var(--mut)">Envie ao novo usuário o endereço do caderno, o e-mail e a senha provisória.</small></div>`;
 const reload=async m=>{db=await loadDb();toast(m);usuarios()};
 document.querySelectorAll("[data-ue]").forEach(b=>b.onclick=()=>{uEdit=b.dataset.ue;uAct=null;usuarios()});
 document.querySelectorAll("[data-upw]").forEach(b=>b.onclick=()=>{uAct={type:"pw",id:b.dataset.upw};usuarios()});
 document.querySelectorAll("[data-utr]").forEach(b=>b.onclick=()=>{uAct={type:"tr",id:b.dataset.utr};usuarios()});
 document.querySelectorAll("[data-ua]").forEach(b=>b.onclick=async()=>{const u=PROFILES.find(x=>x.id===b.dataset.ua);const {error}=await sb.rpc("admin_update_user",{uid:u.id,p_nome:u.nome,p_papel:u.papel,p_ativo:!u.ativo});if(error)return toast(error.message);reload(u.ativo?"Usuário desativado":"Usuário ativado")});
 const x=$("#uX");if(x)x.onclick=()=>{uAct=null;usuarios()};
 const d=$("#uDo");if(d)d.onclick=async()=>{let r;if(uAct.type==="pw"){const s=$("#uNp").value;if(s.length<6)return toast("Use pelo menos 6 caracteres");r=await sb.rpc("admin_set_password",{uid:uAct.id,senha:s})}
  else{await flush();r=await sb.rpc("admin_transfer",{de:uAct.id,para:$("#uTo").value})}
  if(r.error)return toast(r.error.message);const t=uAct.type;uAct=null;reload(t==="pw"?"Senha redefinida: o usuário troca no próximo acesso":`${r.data} cliente(s) transferido(s)`)};
 const c=$("#uC");if(c)c.onclick=()=>{uEdit=null;usuarios()};
 $("#uSave").onclick=async()=>{const nome=$("#uN").value.trim(),papel=$("#uP").value;if(!nome)return toast("Informe o nome");
  if(uEdit){const u=PROFILES.find(x=>x.id===uEdit);const {error}=await sb.rpc("admin_update_user",{uid:uEdit,p_nome:nome,p_papel:papel,p_ativo:u.ativo});if(error)return toast(error.message);uEdit=null;return reload("Usuário atualizado")}
  const email=$("#uE").value.trim(),senha=$("#uS").value;if(!email||senha.length<6)return toast("Informe e-mail e uma senha provisória com 6+ caracteres");
  const tmp=supabase.createClient(EO_CONFIG.url,EO_CONFIG.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"eo_tmp"}});
  const {data,error}=await tmp.auth.signUp({email,password:senha,options:{data:{nome}}});
  if(error)return toast(error.message);if(!data.user||(data.user.identities&&!data.user.identities.length))return toast("Este e-mail já está cadastrado");
  const r=await sb.rpc("admin_setup_user",{uid:data.user.id,p_nome:nome,p_papel:papel});if(r.error)return toast(r.error.message);
  reload("Usuário criado: "+email)};
}
boot(()=>{$("#me").textContent=ME.nome;render()},{gestor:true});
</script>
</body>
</html>
